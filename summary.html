<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Submissions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2980b9; color: white; padding: 12px; border: 1px solid #ddd; text-align: left; }
        td { padding: 10px; border: 1px solid #ddd; }
        tr:nth-child(even) { background: #f9f9f9; }
        .btn { padding: 8px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-view { background: #27ae60; }
        .btn-delete { background: #e74c3c; }
        .btn-home { background: #2980b9; padding: 10px 20px; margin-top: 20px; text-decoration: none; display: inline-block; }
        .details { display: none; background: #f0f8ff; padding: 15px; margin-top: 10px; border-left: 4px solid #2980b9; }
        .loading { text-align: center; padding: 40px; color: #888; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Structure Submissions</h1>
        <div id="tableContainer" class="loading">Loading data from Google Sheet...</div>
        <div style="text-align: center;">
            <a href="index.html" class="btn btn-home">Go to Form</a>
        </div>
    </div>

    <script>
        // This is your Google Apps Script URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2bhGIrq7n6QO9CVz-AMwLZAWEdQUqkhyvxcMDbK9ydVfdU6rjhnDxldJlxINyU9C4/exec';

        // Fetch data from Google Sheet
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                displayTable(data);
            })
            .catch(error => {
                document.getElementById('tableContainer').innerHTML = 
                    '<p style="color:red; text-align:center;">Error loading data. Please refresh the page.</p>';
                console.error('Error:', error);
            });

        function displayTable(submissions) {
            const container = document.getElementById('tableContainer');
            
            if (submissions.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">No submissions yet.</p>';
                return;
            }
            
            let html = `<p><strong>Total Submissions:</strong> ${submissions.length}</p>`;
            html += `<table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Structure ID</th>
                        <th>Owner</th>
                        <th>House No</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>`;
            
            // Reverse to show newest first
            submissions.reverse().forEach((sub, index) => {
                const actualIndex = submissions.length - 1 - index;
                html += `
                    <tr>
                        <td>${sub.Timestamp ? new Date(sub.Timestamp).toLocaleString() : 'N/A'}</td>
                        <td>${sub['Structure ID'] || 'N/A'}</td>
                        <td>${sub.Owner || 'N/A'}</td>
                        <td>${sub['House No'] || 'N/A'}</td>
                        <td>

                                <button class="btn btn-view" onclick="showDetails(${actualIndex})">View Details</button>
                                <button class="btn btn-delete" onclick="deleteRow(${actualIndex})">Delete</button>

                        </td>
                    </tr>
                    <tr id="details-${actualIndex}" style="display:none;">
                        <td colspan="5">
                            <div class="details" style="display:block;">
                                <h3>Details for ${sub['Structure ID'] || 'Unknown'}</h3>
                                <p><strong>Time:</strong> ${sub.Time || 'N/A'}</p>
                                <p><strong>Digital Address:</strong> ${sub['Digital Address'] || 'N/A'}</p>
                                <p><strong>Age:</strong> ${sub.Age || 'N/A'} | <strong>Type:</strong> ${sub.Type || 'N/A'}</p>
                                <p><strong>Dimensions:</strong> ${sub.Length || 'N/A'}m x ${sub.Breadth || 'N/A'}m</p>
                                <p><strong>Wall:</strong> ${sub['Wall Type'] || 'N/A'} | <strong>Plaster:</strong> ${sub['Plaster Type'] || 'N/A'}</p>
                                <p><strong>Roof:</strong> ${sub.Roof || 'N/A'} | <strong>Floor:</strong> ${sub.Floor || 'N/A'}</p>
                                <p><strong>Door:</strong> ${sub.Door || 'N/A'} | <strong>Window:</strong> ${sub.Window || 'N/A'}</p>
                                <p><strong>Foundation:</strong> ${sub['Foundation Type'] || 'N/A'} (Strength: ${sub['Foundation Strength'] || 'N/A'})</p>
                                <p><strong>Wall Strength:</strong> ${sub['Wall Strength'] || 'N/A'}</p>
                                <p><strong>Location:</strong> ${sub.Latitude || 'N/A'}, ${sub.Longitude || 'N/A'}</p>
                                ${sub['Crack Info'] ? `<p><strong>Crack Info:</strong> ${sub['Crack Info']}</p>` : ''}
                                   ${sub['Photo Links'] ? `
       <p><strong>Photos:</strong></p>
       <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
           ${sub['Photo Links'].split(',').map(url => `<img src="${url.trim()}" style="width:150px; height:150px; object-fit:cover; border-radius:4px; border:1px solid #ddd;">`).join('')}
       </div>
   ` : '<p>No photos uploaded</p>'}
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += `</tbody></table>`;
            container.innerHTML = html;
            container.classList.remove('loading');
        }

        function showDetails(index) {
            const row = document.getElementById(`details-${index}`);
            row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
        }

           function deleteRow(index) {
       if(confirm('Are you sure you want to delete this submission? This cannot be undone.')) {
           fetch(SCRIPT_URL + '?action=delete&row=' + index)
               .then(response => response.json())
               .then(data => {
                   if(data.result === 'deleted') {
                       alert('Deleted successfully!');
                       location.reload(); 
                   }
               })
               .catch(err => alert('Error deleting row.'));
       }
   }
    </script>
</body>
</html>
