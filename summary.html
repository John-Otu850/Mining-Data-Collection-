async function loadData() {
    const container = document.getElementById('tableContainer');
    
    try {
        const { data: submissions, error } = await supabaseClient
            .from('submissions')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        if (submissions.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">No submissions yet.</p>';
            return;
        }
        
        displayTable(submissions);
    } catch (error) {
        console.error('Error loading data:', error);
        container.innerHTML = '<p style="color:red; text-align:center;">Error loading data. Please refresh the page.</p>';
    }
}

function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    var R = 6371; 
    var dLat = deg2rad(lat2-lat1);
    var dLon = deg2rad(lon2-lon1); 
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
    return (R * c).toFixed(2);
}

function deg2rad(deg) { return deg * (Math.PI/180); }

async function calculateDistanceBetweenStructures(currentStructureId, targetId) {
    if (!targetId) return;

    const resultDiv = document.getElementById(`distanceResult${currentStructureId}`);
    resultDiv.style.display = 'block';
    resultDiv.textContent = 'Calculating...';

    try {
        const { data: structures, error } = await supabaseClient
            .from('submissions')
            .select('structure_id, latitude, longitude');

        if (error) throw error;

        const currentStruct = structures.find(s => s.structure_id === currentStructureId);
        const targetStruct = structures.find(s => s.structure_id === targetId);

        if (currentStruct && targetStruct && currentStruct.latitude && targetStruct.latitude) {
            const distance = getDistanceFromLatLonInKm(
                parseFloat(currentStruct.latitude), parseFloat(currentStruct.longitude),
                parseFloat(targetStruct.latitude), parseFloat(targetStruct.longitude)
            );
            resultDiv.textContent = ` Distance: ${distance} km`;
            resultDiv.style.color = '#27ae60';
        } else {
            resultDiv.textContent = '️ GPS coordinates not available';
            resultDiv.style.color = '#e74c3c';
        }
    } catch (err) {
        resultDiv.textContent = 'Error calculating distance';
        resultDiv.style.color = '#e74c3c';
    }
}

function populateDistanceDropdown(currentStructureId, allSubmissions) {
    const dropdown = document.getElementById(`distanceTarget${currentStructureId}`);
    if (!dropdown) return;

    dropdown.innerHTML = '<option value="">Select a structure to calculate distance...</option>';
    const allStructures = allSubmissions.filter(s => s.structure_id !== currentStructureId);

    allStructures.forEach(struct => {
        const option = document.createElement('option');
        option.value = struct.structure_id;
        option.textContent = `${struct.structure_id} - ${struct.owner || 'Unknown Owner'}`;
        dropdown.appendChild(option);
    });
}
   async function downloadImage(url, filename) {
       try {
           const response = await fetch(url);
           const blob = await response.blob();
           const blobUrl = window.URL.createObjectURL(blob);
           
           const link = document.createElement('a');
           link.href = blobUrl;
           link.download = `${filename}.jpg`;
           document.body.appendChild(link);
           link.click();
           document.body.removeChild(link);
           window.URL.revokeObjectURL(blobUrl);
       } catch (error) {
           alert('Error downloading image');
           console.error(error);
       }
   }
