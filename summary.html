<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Submissions</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2980b9; color: white; padding: 12px; border: 1px solid #ddd; text-align: left; }
        td { padding: 10px; border: 1px solid #ddd; }
        tr:nth-child(even) { background: #f9f9f9; }
        .btn { padding: 8px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-view { background: #27ae60; }
        .btn-delete { background: #e74c3c; }
        .btn-home { background: #2980b9; padding: 10px 20px; margin-top: 20px; text-decoration: none; display: inline-block; }
        .details { display: none; background: #f0f8ff; padding: 15px; margin-top: 10px; border-left: 4px solid #2980b9; }
        .loading { text-align: center; padding: 40px; color: #888; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
    <h3 style="color: #2c3e50; margin: 0;">Structure App</h3>
    <div>
        <a href="summary.html" style="text-decoration: none; background: #2980b9; color: white; padding: 8px 15px; border-radius: 4px; margin-right: 10px; font-weight: bold;">📋 View Data</a>
        <a href="index.html" style="text-decoration: none; background: #27ae60; color: white; padding: 8px 15px; border-radius: 4px; font-weight: bold;">📝 Submit Form</a>
        <a href="login.html" onclick="logoutUser()" style="text-decoration: none; background: #e74c3c; color: white; padding: 8px 15px; border-radius: 4px; margin-left: 10px; font-weight: bold;"> Logout</a>
    </div>
</div>
        <h1>📋 Structure Submissions</h1>
        <div id="tableContainer" class="loading">Loading data from Google Sheet...</div>
        <div style="text-align: center;">
            <a href="index.html" class="btn btn-home">Go to Form</a>
        </div>
    </div>

    <script>
        // Security Check: If not logged in, go to login page
if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}
       // Supabase Configuration
const SUPABASE_URL = 'https://blfarjbqnnhfuslzjpfj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MPXEEcAtD0KTHdi6h5ZDww_uBj4LAzt';

// Initialize Supabase client
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

// Fetch data from Supabase
async function loadData() {
    const container = document.getElementById('tableContainer');
    
    try {
        const { data: submissions, error } = await supabaseClient
            .from('submissions')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        if (submissions.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">No submissions yet.</p>';
            return;
        }
        
        displayTable(submissions);
    } catch (error) {
        console.error('Error loading data:', error);
        container.innerHTML = '<p style="color:red; text-align:center;">Error loading data. Please refresh the page.</p>';
    }
}

function displayTable(submissions) {
    const container = document.getElementById('tableContainer');
    
    let html = `<p><strong>Total Submissions:</strong> ${submissions.length}</p>`;
    html += `<table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Structure ID</th>
                <th>Owner</th>
                <th>House No</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>`;
    
    submissions.forEach((sub, index) => {
        html += `
            <tr>
                <td>${sub.created_at ? new Date(sub.created_at).toLocaleString() : 'N/A'}</td>
                <td>${sub.structure_id || 'N/A'}</td>
                <td>${sub.owner || 'N/A'}</td>
                <td>${sub.house_no || 'N/A'}</td>
                <td>
                    <button class="btn btn-view" onclick="showDetails(${index})">View Details</button>
                </td>
            </tr>
            <tr id="details-${index}" style="display:none;">
                <td colspan="5">
                    <div class="details" style="display:block;">
                        <h3>Details for ${sub.structure_id || 'Unknown'}</h3>
                        <p><strong>Time:</strong> ${sub.created_at ? new Date(sub.created_at).toLocaleString() : 'N/A'}</p>
                        <p><strong>Digital Address:</strong> ${sub.digital_address || 'N/A'}</p>
                        <p><strong>Age:</strong> ${sub.age || 'N/A'} | <strong>Type:</strong> ${sub.type || 'N/A'}</p>
                        <p><strong>Dimensions:</strong> ${sub.length_m || 'N/A'}m x ${sub.breadth_m || 'N/A'}m</p>
                        <p><strong>Wall:</strong> ${sub.wall_type || 'N/A'} | <strong>Plaster:</strong> ${sub.plaster_type || 'N/A'}</p>
                        <p><strong>Roof:</strong> ${sub.roof || 'N/A'} | <strong>Floor:</strong> ${sub.floor || 'N/A'}</p>
                        <p><strong>Door:</strong> ${sub.door || 'N/A'} | <strong>Window:</strong> ${sub.window_type || 'N/A'}</p>
                        <p><strong>Foundation:</strong> ${sub.foundation_type || 'N/A'} (Strength: ${sub.foundation_strength || 'N/A'})</p>
                        <p><strong>Wall Strength:</strong> ${sub.wall_strength || 'N/A'}</p>
                        <p><strong>Latitude:</strong> ${sub.latitude || 'N/A'} | <strong>Longitude:</strong> ${sub.longitude || 'N/A'}</p>
                        ${sub.crack_info ? `<p><strong>Crack Info:</strong> ${sub.crack_info}</p>` : ''}
                        ${sub.photo_links ? `
                            <p><strong>Photos:</strong></p>
                            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
                                   ${sub.photo_links.split(',').map((url, idx) => `
       <div style="position:relative; display:inline-block;">
                           <img src="${url.trim()}" style="width:150px; height:150px; object-fit:cover; border-radius:4px; border:1px solid #ddd;">
                           <button onclick="downloadImage('${url.trim()}', '${sub.structure_id}_${idx}')" 
                                   style="position:absolute; top:5px; right:5px; background:#2980b9; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">
                               ⬇️ Download
                           </button>
                       </div>
                   `).join('')}
                            </div>
                        ` : '<p>No photos uploaded</p>'}
                    </div>
                </td>
            </tr>
        `;
    });
    
    html += `</tbody></table>`;
    container.innerHTML = html;
    container.classList.remove('loading');
}

function showDetails(index) {
    const row = document.getElementById(`details-${index}`);
    row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

// Load data when page loads
loadData();

   async function downloadImage(url, filename) {
       try {
           const response = await fetch(url);
           const blob = await response.blob();
           const blobUrl = window.URL.createObjectURL(blob);
           
           const link = document.createElement('a');
           link.href = blobUrl;
           link.download = `${filename}.jpg`;
           document.body.appendChild(link);
           link.click();
           document.body.removeChild(link);
           window.URL.revokeObjectURL(blobUrl);
       } catch (error) {
           alert('Error downloading image');
           console.error(error);
       }
   }
   function logoutUser() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('userRole');
}
    </script>
</body>
</html>
