<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Information Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        header h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .form-section { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #eaeaea; border-radius: 6px; }
        .form-section h2 { font-size: 18px; color: #2980b9; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-row .form-group:only-child { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #444; }
        input[type="text"], input[type="number"], input[type="time"], select, input[type="file"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input::placeholder { color: #999; font-style: italic; }
        input:focus, select:focus { outline: none; border-color: #2980b9; box-shadow: 0 0 5px rgba(41, 128, 185, 0.2); }
        small { font-size: 12px; color: #888; margin-top: 5px; display: block; }
        .btn-gps { margin-top: 8px; padding: 8px 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-gps:hover { background-color: #219150; }
        .btn-add { margin-top: 10px; padding: 8px 15px; background-color: #f39c12; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-add:hover { background-color: #d68910; }
        .form-actions { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn-submit { padding: 12px 30px; background-color: #2980b9; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #1f618d; }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-reset { padding: 12px 30px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .crack-table table { width: 100%; border-collapse: collapse; background: white; }
        .crack-table th, .crack-table td { border: 1px solid #ddd; padding: 10px; }
        .crack-table th { background-color: #2c3e50; color: white; font-size: 14px; }
        .crack-input { width: 100%; border: none; padding: 5px; }
        .photo-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .photo-preview img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
        /* Header Navigation Styles */
.header-nav { 
    display: flex;

    align-items: center;

}

/* Mobile Responsive Fix */
@media (max-width: 600px) {

    }

}

    <script>
       // Supabase Configuration
const SUPABASE_URL = 'https://blfarjbqnnhfuslzjpfj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MPXEEcAtD0KTHdi6h5ZDww_uBj4LAzt';

// Initialize Supabase client
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('structureForm').addEventListener('submit', async function(e) {
    e.preventDefault(); 
    
    const btn = document.getElementById('submitBtn');
    const originalText = btn.textContent;
    btn.textContent = 'Uploading photos & saving... Please wait';
    btn.disabled = true;

    const formData = new FormData(this);
    const data = {};
    
    // Collect all text/number inputs
    for (let [key, value] of formData.entries()) {
        if (key !== 'photos') data[key] = value;
    }

    // 1. Collect Crack Info text
    let crackInfo = "";
    let crackPhotoFiles = [];
    const crackInputs = document.querySelectorAll('#crackBody tr');
    
    crackInputs.forEach((row, index) => {
        const idInput = row.querySelector(`[name="Crack${index+1}_ID"]`);
        if (idInput && idInput.value) {
            const len = row.querySelector(`[name="Crack${index+1}_Length"]`).value;
            const wid = row.querySelector(`[name="Crack${index+1}_Width"]`).value;
            const nat = row.querySelector(`[name="Crack${index+1}_Nature"]`).value;
            crackInfo += `Crack ${index+1}: ID=${idInput.value}, Length=${len}mm, Width=${wid}mm, Nature=${nat} | `;
            
            // Collect crack photo if it exists
            const fileInput = row.querySelector('input[type="file"]');
            if (fileInput && fileInput.files[0]) {
                crackPhotoFiles.push(fileInput.files[0]);
            }
        }
    });
    data.crack_info = crackInfo;

    // 2. Prepare all files for upload
    let allUploads = [];
    
    // General photos
    const generalFileInput = document.getElementById('photos');
    if (generalFileInput.files.length > 0) {
        for (let file of generalFileInput.files) allUploads.push({ file, type: 'general' });
    }

    // House photo
    const houseFileInput = document.getElementById('housePhotoInput');
    if (houseFileInput.files[0]) {
        allUploads.push({ file: houseFileInput.files[0], type: 'house' });
    }

    // Crack photos
    crackPhotoFiles.forEach(file => {
        allUploads.push({ file, type: 'crack' });
    });

    // 3. Upload all files to ImgBB
    let generalUrls = [];
    let houseUrl = "";
    let crackUrls = [];

        if (allUploads.length > 0) {
        const uploadPromises = allUploads.map(async (item) => {
            const file = item.file;
            const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            
            const { data, error } = await supabaseClient.storage
                .from('images')
                .upload(fileName, file);

            if (error) throw error;

            const { data: { publicUrl } } = supabaseClient.storage
                .from('images')
                .getPublicUrl(fileName);

            return { url: publicUrl, type: item.type };
        });

        try {
            const results = await Promise.all(uploadPromises);
            results.forEach(res => {
                if (res.type === 'general') generalUrls.push(res.url);
                if (res.type === 'house') houseUrl = res.url;
                if (res.type === 'crack') crackUrls.push(res.url);
            });
        } catch (err) {
            alert('Error uploading photos to secure storage: ' + err.message);
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }
    }
        try {
            const results = await Promise.all(uploadPromises);
            results.forEach(res => {
                if (res.type === 'general') generalUrls.push(res.url);
                if (res.type === 'house') houseUrl = res.url;
                if (res.type === 'crack') crackUrls.push(res.url);
            });
        } catch (err) {
            alert('Error uploading photos: ' + err.message);
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }
    }

    data.photo_links = generalUrls.join(', ');
    data.house_photo_url = houseUrl;
    data.crack_photos = crackUrls.join(', ');

    // 4. Save to Supabase
    try {
        const { error } = await supabaseClient
            .from('submissions')
            .insert([{
                structure_id: data.Structure_ID,
                owner: data.Owner,
                house_no: data.House_No,
                digital_address: data.Digital_Address,
                age: data.Age,
                type: data.Type,
                length_m: parseFloat(data.Length_m),
                breadth_m: parseFloat(data.Breadth_m),
                wall_type: data.Wall_Type,
                plaster_type: data.Plaster_Type,
                roof: data.Roof,
                floor: data.Floor,
                door: data.Door,
                window_type: data.Window,
                foundation_type: data.Foundation_Type,
                foundation_strength: parseFloat(data.Foundation_Strength),
                wall_strength: parseFloat(data.Wall_Strength),
                latitude: data.Latitude,
                longitude: data.Longitude,
                crack_info: data.crack_info,
                photo_links: data.photo_links,
                house_photo_url: data.house_photo_url, // NEW
                crack_photos: data.crack_photos         // NEW
            }]);

        if (error) throw error;

        alert('Form submitted successfully!');
        this.reset();
        document.getElementById('photoPreview').innerHTML = '';
        document.getElementById('housePhotoPreview').innerHTML = '';
        btn.textContent = originalText;
        btn.disabled = false;
        window.location.href = 'summary.html';
        
    } catch (err) {
        alert('Error submitting form: ' + err.message);
        console.error(err);
        btn.textContent = originalText;
        btn.disabled = false;
    }
});

async function captureGPS() {
    const distElement = document.getElementById('distanceStatus');
    distElement.style.display = 'none'; // Hide previous message

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lon;

            // Fetch the last survey from Supabase to calculate distance
            try {
                const { data, error } = await supabaseClient
                    .from('submissions')
                    .select('latitude, longitude')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (data && data.length > 0 && !error) {
                    const lastLat = data[0].latitude;
                    const lastLon = data[0].longitude;
                    
                    // Calculate distance
                    const dist = getDistanceFromLatLonInKm(lastLat, lastLon, lat, lon);
                    
                    distElement.style.display = 'block';
                    distElement.textContent = `📍 Distance from last survey: ${dist} km`;
                } else {
                    // If it's the very first survey
                    distElement.style.display = 'block';
                    distElement.textContent = `📍 This is your first survey point!`;
                }
            } catch (err) {
                console.log("Could not fetch previous location:", err);
            }

        }, function(error) {
            alert("Error capturing GPS: " + error.message);
        });
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}

function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    var R = 6371; // Radius of the earth in km
    var dLat = deg2rad(lat2-lat1);
    var dLon = deg2rad(lon2-lon1); 
    var a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
    var d = R * c; 
    return d.toFixed(2); // Returns distance in km with 2 decimals
}
function deg2rad(deg) {
    return deg * (Math.PI/180);
}   

function addCrackRow() {
    const tbody = document.getElementById('crackBody');
    const count = tbody.rows.length + 1;
    const newRow = tbody.insertRow();
    newRow.innerHTML = `
        <td><input type="text" name="Crack${count}_ID" class="crack-input" placeholder="e.g., C${count}"></td>
        <td><input type="number" name="Crack${count}_Length" class="crack-input" step="0.1" placeholder="e.g., 5.5"></td>
        <td><input type="number" name="Crack${count}_Width" class="crack-input" step="0.1" placeholder="e.g., 1.2"></td>
        <td><input type="text" name="Crack${count}_Nature" class="crack-input" placeholder="e.g., Deep"></td>
        <td style="text-align: center;">
            <input type="file" id="crackPhotoInput${count}" accept="image/*" capture="environment" style="display: none;" onchange="previewImage(this, 'crackPhotoPreview${count}')">
            <button type="button" class="btn-gps" style="padding: 5px 10px; margin: 0;" onclick="document.getElementById('crackPhotoInput${count}').click()">📷</button>
            <div id="crackPhotoPreview${count}" class="photo-preview" style="justify-content: center;"></div>
        </td>
    `;
}

function previewImage(input, previewId) {
    const preview = document.getElementById(previewId);
    preview.innerHTML = ''; 
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            preview.appendChild(img);
        }
        reader.readAsDataURL(input.files[0]);
    }
}

function previewPhotos(event) {
    const preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    for (let file of event.target.files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            preview.appendChild(img);
        }
        reader.readAsDataURL(file);
    }
}
    </script>
